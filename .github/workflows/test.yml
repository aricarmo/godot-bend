name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Every tests/*.bend, built into a GDExtension and run inside a
      # headless Godot.
      - run: docker build -f tools/linux.Dockerfile -t godot-bend-linux .
      - run: docker run --rm godot-bend-linux
